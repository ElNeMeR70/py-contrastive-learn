[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "py-contrastive-learn"
version = "1.0.0"
description = "SimCLR contrastive learning with NT-Xent loss"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Mahmoud ElNemer", email = "sultanelnemer@gmail.com"}]
keywords = ["python", "contrastive-learning", "simclr", "representation", "ai"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/ElNeMeR70/py-contrastive-learn"
Repository = "https://github.com/ElNeMeR70/py-contrastive-learn"
